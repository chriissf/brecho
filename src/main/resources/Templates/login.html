<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entrar | Brechó Vintage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #d8c3a5, #eae7dc);
            display: flex;
            justify-content: center;
            align-items: center;
            background-attachment: fixed;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 40px;
            width: 350px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container h2 {
            text-align: center;
            color: #5e412f;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #5e412f;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.5);
            transition: background 0.3s;
        }

        .input-group input:focus {
            background-color: rgba(255, 255, 255, 0.8);
            outline: none;
        }

        .error {
            color: #c0392b;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6f4e37;
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #5e3f2c;
        }

        .footer-text {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
            color: #7b5e4d;
        }

        .footer-text a {
            color: #5e412f;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Bem-vindo ao Brechó Vintage</h2>
    <form th:action="@{/login}" method="post">
        <div th:if="${param.error}" class="error">E-mail ou senha inválidos.</div>
        <div class="input-group">
            <label for="email">E-mail</label>
            <input type="text" id="email" name="email" placeholder="exemplo@brecho.com" required />
        </div>
        <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="senha" placeholder="********" required />
        </div>
        <button type="submit">Entrar</button>
    </form>

    <div class="footer-text">
        Ainda não tem conta? <a th:href="@{/cadastroUsuario}">Cadastre-se</a>
    </div>

</div>
</body>
</html>
